name: Daily trigger
on:
  schedule:
    - cron: '45 15 * * *'  # 18:45 MSK = 15:45 UTC
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily question
        run: curl -s -H "Authorization: Bearer ${{ secrets.TRIGGER_SECRET }}" "https://headache-bot.onrender.com/trigger"
